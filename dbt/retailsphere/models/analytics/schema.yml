version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly product sales for delivered orders, assigned by purchase timestamp.
      Materialized as a view in the analytics schema. Includes every calendar
      month between the earliest and latest delivered purchases with non-NULL
      purchase timestamps, including orders without items. Empty months have
      zero revenue, orders and items, and a NULL average order value. No eligible
      purchases produce no rows. NULL purchase timestamps are excluded and
      reported by assert_monthly_sales_purchase_dates. Assumes unique, non-NULL
      order IDs and valid non-NULL NUMERIC item prices, checked by CLEAN tests.
    columns:
      - name: month
        description: "First day of the purchase calendar month, stored as DATE; the model's unique key."
        data_tests:
          - unique
          - not_null

      - name: product_revenue
        description: "SUM of eligible item prices as unconstrained NUMERIC, excluding freight; zero when no prices contribute. No rounding is applied."
        data_tests:
          - not_null

      - name: total_orders
        description: "Distinct delivered order IDs purchased in the month, including orders without items; zero for empty months."
        data_tests:
          - not_null

      - name: total_items
        description: "Number of matching order-item rows, regardless of NULL item identifiers or prices; zero for empty months."
        data_tests:
          - not_null

      - name: average_order_value
        description: "NUMERIC product_revenue / NULLIF(total_orders, 0), without explicit rounding; NULL when total_orders is zero."
  - name: category_sales
    description: >-
      Product sales grouped by category, including only delivered orders.
      Each row represents one product category. Missing categories are
      represented as 'unknown'. Revenue is calculated from item prices,
      excluding freight charges.
    columns:
      - name: product_category_name
        description: "Name of the category for all products that were grouped. With 'unknown' to missing values"
        data_tests:
          - unique
          - not_null

      - name: total_orders
        description: "Number of distinct delivered orders per category"
        data_tests:
          - not_null

      - name: total_items
        description: "Number of total items that were grouped by category name"
        data_tests:
          - not_null

      - name: product_revenue
        description: "Sum of price, without freight_value"
        data_tests:
          - not_null

  - name: delivery_performance
    description: >-
      One global summary row for delivered CLEAN orders, materialized as a view
      in the analytics schema. Punctuality compares actual and estimated calendar
      dates. Orders missing either date remain in total and missing-date counts
      but are excluded from delivery classes and the late-rate denominator.
      Empty input produces zero counts and NULL rate and average.
    columns:
      - name: total_delivered_orders
        description: "Count of all orders with order_status = 'delivered', including non-evaluable orders."
        data_tests:
          - not_null

      - name: evaluable_delivered_orders
        description: "Delivered orders with both actual and estimated delivery dates."
        data_tests:
          - not_null

      - name: missing_delivery_dates
        description: "Delivered orders missing either or both dates; each order is counted once."
        data_tests:
          - not_null

      - name: early_deliveries
        description: "Evaluable delivered orders whose actual calendar date precedes the estimate."
        data_tests:
          - not_null

      - name: on_time_deliveries
        description: "Evaluable delivered orders whose actual calendar date equals the estimate, regardless of time."
        data_tests:
          - not_null

      - name: late_deliveries
        description: "Evaluable delivered orders whose actual calendar date follows the estimate."
        data_tests:
          - not_null

      - name: late_delivery_rate_pct
        description: "NUMERIC percentage (0-100): 100 * late_deliveries / NULLIF(evaluable_delivered_orders, 0), rounded to two decimal places; NULL with no evaluable orders."

      - name: avg_late_days
        description: "NUMERIC mean of actual DATE minus estimated DATE for late orders only, rounded to two decimal places; NULL when there are no late orders."

  - name: repeat_customers
    description: >-
      One row per identifiable buyer with at least one distinct delivered order,
      across all available history. customer_unique_id identifies the buyer;
      customer_id identifies the order-linked customer record. Missing buyer
      identities and unmatched customers are excluded and reported by a singular
      test. Counts and repeat flags support filter-context KPI measures in Power BI.
      No eligible purchases produce no rows.
    columns:
      - name: customer_unique_id
        description: "Source TEXT buyer identifier; unique grain, never NULL or blank."
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('customers')
                field: customer_unique_id

      - name: completed_purchases
        description: "BIGINT count of distinct delivered order IDs for the buyer; at least one."
        data_tests:
          - not_null

      - name: is_repeat_customer
        description: "BOOLEAN: TRUE for at least two completed purchases, FALSE for exactly one."
        data_tests:
          - not_null

  - name: customer_satisfaction
    description: >-
      One row per delivered order, including orders with no valid review. Select
      the latest valid score (integer 1-5) by answer timestamp, creation timestamp,
      review ID in C collation ascending, then score ascending; timestamps and
      IDs sort NULL last. Equivalent ties have identical projected review values.
      Review coverage uses all delivered orders; positive satisfaction uses only
      orders with a selected valid score, with 4-5 positive. This is not NPS.
      No eligible orders produce no rows.
    columns:
      - name: order_id
        description: "TEXT delivered-order identifier and unique model grain."
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('orders')
                field: order_id

      - name: order_purchase_timestamp
        description: "CLEAN purchase TIMESTAMP for order-cohort filtering; NULL retained."

      - name: review_record_count
        description: "BIGINT count of all source review records linked to this order, including duplicates and invalid scores; zero without records."
        data_tests:
          - not_null

      - name: valid_review_count
        description: "BIGINT count of linked source records with scores 1-5, including duplicates; not the reviewed-order KPI."
        data_tests:
          - not_null

      - name: selected_review_id
        description: "Selected source review ID; may repeat across orders and may be NULL. Use has_valid_review to identify reviewed orders."

      - name: review_score
        description: "Selected INTEGER score 1-5; NULL when no valid review exists."
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

      - name: review_creation_date
        description: "Selected review's typed creation TIMESTAMP, or NULL."

      - name: review_answer_timestamp
        description: "Selected review's typed answer TIMESTAMP, or NULL."

      - name: has_valid_review
        description: "Non-NULL BOOLEAN indicating a selected valid score, regardless of whether its review ID is present."
        data_tests:
          - not_null

      - name: is_positive_review
        description: "Nullable BOOLEAN: TRUE for scores 4-5, FALSE for scores 1-3, NULL without a valid review."
