version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly product sales for delivered orders, assigned by purchase timestamp.
      Materialized as a view in the analytics schema. Includes every calendar
      month between the earliest and latest delivered purchases with non-NULL
      purchase timestamps, including orders without items. Empty months have
      zero revenue, orders and items, and a NULL average order value. No eligible
      purchases produce no rows. NULL purchase timestamps are excluded and
      reported by assert_monthly_sales_purchase_dates. Assumes unique, non-NULL
      order IDs and valid non-NULL NUMERIC item prices, checked by CLEAN tests.
    columns:
      - name: month
        description: "First day of the purchase calendar month, stored as DATE; the model's unique key."
        data_tests:
          - unique
          - not_null

      - name: product_revenue
        description: "SUM of eligible item prices as unconstrained NUMERIC, excluding freight; zero when no prices contribute. No rounding is applied."
        data_tests:
          - not_null

      - name: total_orders
        description: "Distinct delivered order IDs purchased in the month, including orders without items; zero for empty months."
        data_tests:
          - not_null

      - name: total_items
        description: "Number of matching order-item rows, regardless of NULL item identifiers or prices; zero for empty months."
        data_tests:
          - not_null

      - name: average_order_value
        description: "NUMERIC product_revenue / NULLIF(total_orders, 0), without explicit rounding; NULL when total_orders is zero."
  - name: category_sales
    description: >-
      Product sales grouped by category, including only delivered orders.
      Each row represents one product category. Missing categories are
      represented as 'unknown'. Revenue is calculated from item prices,
      excluding freight charges.
    columns:
      - name: product_category_name
        description: "Name of the category for all products that were grouped. With 'unknown' to missing values"
        data_tests:
          - unique
          - not_null

      - name: total_orders
        description: "Number of distinct delivered orders per category"
        data_tests:
          - not_null

      - name: total_items
        description: "Number of total items that were grouped by category name"
        data_tests:
          - not_null

      - name: product_revenue
        description: "Sum of price, without freight_value"
        data_tests:
          - not_null

  - name: delivery_performance
    description: >-
      One global summary row for delivered CLEAN orders, materialized as a view
      in the analytics schema. Punctuality compares actual and estimated calendar
      dates. Orders missing either date remain in total and missing-date counts
      but are excluded from delivery classes and the late-rate denominator.
      Empty input produces zero counts and NULL rate and average.
    columns:
      - name: total_delivered_orders
        description: "Count of all orders with order_status = 'delivered', including non-evaluable orders."
        data_tests:
          - not_null

      - name: evaluable_delivered_orders
        description: "Delivered orders with both actual and estimated delivery dates."
        data_tests:
          - not_null

      - name: missing_delivery_dates
        description: "Delivered orders missing either or both dates; each order is counted once."
        data_tests:
          - not_null

      - name: early_deliveries
        description: "Evaluable delivered orders whose actual calendar date precedes the estimate."
        data_tests:
          - not_null

      - name: on_time_deliveries
        description: "Evaluable delivered orders whose actual calendar date equals the estimate, regardless of time."
        data_tests:
          - not_null

      - name: late_deliveries
        description: "Evaluable delivered orders whose actual calendar date follows the estimate."
        data_tests:
          - not_null

      - name: late_delivery_rate_pct
        description: "NUMERIC percentage (0-100): 100 * late_deliveries / NULLIF(evaluable_delivered_orders, 0), rounded to two decimal places; NULL with no evaluable orders."

      - name: avg_late_days
        description: "NUMERIC mean of actual DATE minus estimated DATE for late orders only, rounded to two decimal places; NULL when there are no late orders."
