version: 2

models:
  - name: orders
    description: "Cleaned Olist orders with typed timestamps and delivery quality indicators."
    columns:
      - name: order_id
        description: "Unique identifier for each order."
        data_tests:
          - unique
          - not_null

  - name: customers
    description: "Olist customers with all source rows and TEXT values preserved, including invalid geographic attributes."
    columns:
      - name: customer_id
        description: "Unique identifier for each customer record."
        data_tests:
          - unique
          - not_null

      - name: customer_unique_id
        description: "Buyer identifier; repeated values may represent returning buyers and are preserved."
        data_tests:
          - not_null

      - name: customer_zip_code_prefix
        description: "Five-digit postal prefix stored as TEXT to preserve leading zeros."

      - name: customer_city
        description: "Customer city preserved as source TEXT."

      - name: customer_state
        description: "Brazilian UF code, including the Federal District (DF)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - AC
                  - AL
                  - AP
                  - AM
                  - BA
                  - CE
                  - DF
                  - ES
                  - GO
                  - MA
                  - MT
                  - MS
                  - MG
                  - PA
                  - PB
                  - PR
                  - PE
                  - PI
                  - RJ
                  - RN
                  - RS
                  - RO
                  - RR
                  - SC
                  - SP
                  - SE
                  - TO

  - name: order_items
    description: "All RAW items preserved at (order_id, order_item_id) grain, with safely typed values and conversion quality flags."
    columns:
      - name: order_id
        description: "Order identifier preserved as source TEXT; part of the composite item key."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: raw.orders
                field: order_id

      - name: order_item_id
        description: "Item identifier preserved as source TEXT; unique only within an order."
        data_tests:
          - not_null

      - name: product_id
        description: "Product identifier preserved as source TEXT."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: raw.products
                field: product_id

      - name: seller_id
        description: "Seller identifier preserved as source TEXT."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: raw.sellers
                field: seller_id

      - name: shipping_limit_date
        description: "Safely converted TIMESTAMP; missing or invalid source values become NULL."

      - name: price
        description: "Unconstrained NUMERIC without rounding or zero defaults; must be greater than zero. Missing, malformed or nonfinite source values become NULL."
        data_tests:
          - not_null

      - name: freight_value
        description: "Unconstrained NUMERIC without rounding or zero defaults; must be nonnegative. Missing, malformed or nonfinite source values become NULL."
        data_tests:
          - not_null

      - name: is_shipping_limit_date_invalid
        description: "TRUE for non-NULL source values rejected by safe_timestamp; FALSE for source NULLs."

      - name: is_price_invalid
        description: "TRUE for non-NULL malformed or nonfinite source values; FALSE for source NULLs and finite numbers, including nonpositive prices reported by range tests."

      - name: is_freight_value_invalid
        description: "TRUE for non-NULL malformed or nonfinite source values; FALSE for source NULLs and finite numbers, including negative freight reported by range tests."

  - name: products
    description: "All RAW products preserved without filtering, deduplication or imputation, with safely typed attributes and conversion quality flags. Materialized as a view via the clean configuration."
    columns:
      - name: product_id
        description: "Unique product identifier preserved as source TEXT."
        data_tests:
          - unique
          - not_null

      - name: product_category_name
        description: "Category preserved as source TEXT, including NULL; no Unknown category is assigned in CLEAN."

      - name: product_name_lenght
        description: "Safely converted INTEGER, preserving the Olist spelling. Source NULLs remain NULL; invalid or out-of-range INTEGER inputs become NULL. Nonnegative values are required by range tests."

      - name: product_description_lenght
        description: "Safely converted INTEGER, preserving the Olist spelling. Source NULLs remain NULL; invalid or out-of-range INTEGER inputs become NULL. Nonnegative values are required by range tests."

      - name: product_photos_qty
        description: "Safely converted INTEGER. Source NULLs remain NULL; invalid or out-of-range INTEGER inputs become NULL. Nonnegative values are required by range tests."

      - name: product_weight_g
        description: "Safely converted finite NUMERIC without rounding or imputation. Source NULLs remain NULL; invalid or nonfinite inputs become NULL. Zero is preserved; negative weights are reported by range tests."

      - name: product_length_cm
        description: "Safely converted finite NUMERIC. Source NULLs remain NULL; invalid or nonfinite inputs become NULL. Strictly positive values are required by range tests."

      - name: product_height_cm
        description: "Safely converted finite NUMERIC. Source NULLs remain NULL; invalid or nonfinite inputs become NULL. Strictly positive values are required by range tests."

      - name: product_width_cm
        description: "Safely converted finite NUMERIC. Source NULLs remain NULL; invalid or nonfinite inputs become NULL. Strictly positive values are required by range tests."

      - name: is_product_name_lenght_invalid
        description: "TRUE for non-NULL source values rejected as INTEGER, including overflow; FALSE for source NULLs and valid integers, including negatives reported by range tests."
        data_tests:
          - not_null

      - name: is_product_description_lenght_invalid
        description: "TRUE for non-NULL source values rejected as INTEGER, including overflow; FALSE for source NULLs and valid integers, including negatives reported by range tests."
        data_tests:
          - not_null

      - name: is_product_photos_qty_invalid
        description: "TRUE for non-NULL source values rejected as INTEGER, including overflow; FALSE for source NULLs and valid integers, including negatives reported by range tests."
        data_tests:
          - not_null

      - name: is_product_weight_g_invalid
        description: "TRUE for non-NULL malformed or nonfinite source values; FALSE for source NULLs and finite numbers, including zero and negatives reported by range tests."
        data_tests:
          - not_null

      - name: is_product_length_cm_invalid
        description: "TRUE for non-NULL malformed or nonfinite source values; FALSE for source NULLs and finite numbers, including nonpositive dimensions reported by range tests."
        data_tests:
          - not_null

      - name: is_product_height_cm_invalid
        description: "TRUE for non-NULL malformed or nonfinite source values; FALSE for source NULLs and finite numbers, including nonpositive dimensions reported by range tests."
        data_tests:
          - not_null

      - name: is_product_width_cm_invalid
        description: "TRUE for non-NULL malformed or nonfinite source values; FALSE for source NULLs and finite numbers, including nonpositive dimensions reported by range tests."
        data_tests:
          - not_null

      - name: is_weight_zero
        description: "TRUE exactly when the converted weight is zero; FALSE for nonzero weights, source NULLs and invalid weights. The weight itself is never imputed."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
