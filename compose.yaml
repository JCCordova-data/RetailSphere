services:
  postgres:
    image: postgres:18
    container_name: retailsphere-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Variable requerida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Variable requerida}
      POSTGRES_DB: ${POSTGRES_DB:?Variable requerida}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
